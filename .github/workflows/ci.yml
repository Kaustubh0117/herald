name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Service containers can't pass -c flags, so start Postgres by hand.
      - name: Start Postgres with logical replication
        run: |
          docker run -d -p 5432:5432 -e POSTGRES_PASSWORD=herald postgres:16 \
            -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          for i in $(seq 30); do docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 && break; sleep 1; done
      - run: make lint
      - run: make test-pg
